############################
# SOC LOGSTASH PIPELINE
############################

input {
  file {
    path => "C:/Elastic/test-logs/soc-test.log"
    start_position => "beginning"
    sincedb_path => "NUL"
  }
}

filter {
  mutate {
    add_field => {
      "soc_lab" => "true"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://localhost:9200"]

    # Credentials stored in environment variables for security
    user => "${ES_USER}"
    password => "${ES_PASSWORD}"

    index => "soc-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
